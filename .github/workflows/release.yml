# Builds the app on every push to main (and on version tags like v1.2.0)
# and publishes it on the Releases tab.
name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $tag = "v$version-build.$env:GITHUB_RUN_NUMBER"
          }
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item target/release/public-folders.exe out/Public-Folders.exe
          Copy-Item "tools/READ ME - Public Folders.txt" out/READ-ME.txt
          Compress-Archive -Path out/Public-Folders.exe, out/READ-ME.txt -DestinationPath out/Public-Folders-windows-x64.zip -Force
          "TAG=$tag" >> $env:GITHUB_ENV
          "BUILT=$(Get-Date -Format 'yyyy-MM-dd HH:mm') UTC" >> $env:GITHUB_ENV

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Public Folders ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: true
          body: |
            Built automatically from commit ${{ github.sha }} on ${{ env.BUILT }}.

            **Download:** `Public-Folders.exe` (Windows 10/11, 64-bit) — nothing to install, just run it.
            Or `Public-Folders-windows-x64.zip` with the program and a short read-me for your team.

            The file isn't signed, so Windows may say "Windows protected your PC" the first time:
            click **More info → Run anyway**.
          files: |
            out/Public-Folders.exe
            out/Public-Folders-windows-x64.zip
