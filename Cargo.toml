[package]
name = "public-folders"
version = "0.1.0"
edition = "2021"
description = "A lightweight viewer for Microsoft Exchange public folders"

[[bin]]
name = "public-folders"
path = "src/main.rs"

[dependencies]
eframe = { version = "=0.29.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
ureq = { version = "2.12", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
md4 = "0.10"
md-5 = "0.10"
hmac = "0.12"
getrandom = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
png = "0.17"
mail-parser = "0.9"
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Authentication_Identity", "Win32_Security_Credentials", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Shell", "Win32_System_Power", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Memory", "Win32_System_DataExchange", "Win32_Graphics_Gdi", "Win32_System_Com_StructuredStorage", "Win32_System_SystemServices"] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"

[profile.release]
opt-level = "s"
lto = true
strip = true
